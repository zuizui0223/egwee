name: External Heliconia recruitment denominator audit

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/audit_heliconia_recruitment_denominators.py'
      - 'scripts/audit_heliconia_stock_prediction.py'
      - 'manuscript/HELICONIA_RECRUITMENT_REANALYSIS_2026-10-08.md'
      - '.github/workflows/helconia-external-recruitment-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct plot-level contrasts from pinned external raw data
        run: python scripts/audit_heliconia_recruitment_denominators.py
      - name: Check held-out plot and ranch predictions
        run: python scripts/audit_heliconia_stock_prediction.py
      - name: Archive audit results
        uses: actions/upload-artifact@v4
        with:
          name: heliconia-recruitment-audit
          path: build/heliconia_external_audit/
          if-no-files-found: error
