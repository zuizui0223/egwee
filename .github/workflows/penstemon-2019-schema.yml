name: Penstemon 2019 schema gate

on:
  pull_request:
    paths:
      - 'manuscript/PENSTEMON_2019_ISOLATION_CLUSTER_RECOVERY_CONTRACT.md'
      - 'scripts/probe_penstemon_2019_zenodo_schema.py'
      - '.github/workflows/penstemon-2019-schema.yml'
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect Zenodo metadata and CSV schema only
        run: python scripts/probe_penstemon_2019_zenodo_schema.py
