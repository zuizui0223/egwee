name: Echinacea long-term maternal holdout and focal-circle audit
on:
  pull_request:
    paths:
      - 'research/molecular_conservation/run_ech01a_maternal_holdout.py'
      - 'research/molecular_conservation/audit_ech02_focal_circle_join.py'
      - 'research/molecular_conservation/audit_ech01a_published_range.py'
      - '.github/workflows/ech01a-maternal-holdout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maternal-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen design and synthetic parent separation
        run: |
          git merge-base --is-ancestor 4e495ab61ac5057f02c5578c769975854dbe7b00 HEAD
          PYTHONPATH=research/molecular_conservation python - <<'PY'
          from run_ech01a_maternal_holdout import foldplan,predict
          r=[(str(i//4),'p'+str(i%4),float(i),float(i%3),float(i%5),float(i%7),float(i%7),'bot',float(i%4),float(i%2)) for i in range(120)]
          plan=foldplan(r,False)
          assert len(plan)==30
          assert all(not ({x[0] for x in tr}&{x[0] for x in te}) for tr,te in plan)
          assert all(0<=x<=1 for x in predict(*plan[0],True,9))
          plan=foldplan(r,True)
          assert all(not ({p for x in tr for p in x[:2]}&{p for x in te for p in x[:2]}) for tr,te in plan)
          PY
      - name: Diagnose published range precision without outcomes
        run: |
          mkdir -p source_receipt
          python research/molecular_conservation/audit_ech01a_published_range.py | tee source_receipt/ech01a_range.json
      - name: Run pinned long-term offspring prediction comparison
        run: |
          mkdir -p source_receipt
          python research/molecular_conservation/run_ech01a_maternal_holdout.py | tee source_receipt/ech01a.json
      - name: Check author-defined ECH02 focal-circle alignment and follow-up
        run: python research/molecular_conservation/audit_ech02_focal_circle_join.py | tee source_receipt/ech02_focal_join.json
      - name: Verify claim boundaries and result grain
        run: |
          python - <<'PY'
          import json
          r=json.load(open('source_receipt/ech01a.json'))
          assert r['raw_records_exported'] is False and r['author_code_executed'] is False
          assert r['molecular_GxIxF_validated'] is False and r['causal_effect_claimed'] is False
          assert r['protocol']=='4e495ab61ac5057f02c5578c769975854dbe7b00'
          if r['status']=='ECH01A_COMPLETE':
              assert r['included_offspring']==436
              assert r['head_year_count']==13
              for k in ('maternal_holdout','parent_disjoint_sensitivity'):
                  if r[k]['status']=='COMPLETE':
                      for q in ('cumulative_heads','alive_2022'):
                          assert sum(f['n'] for f in r[k][q]['fold_results'])==436
          e=json.load(open('source_receipt/ech02_focal_join.json'))
          assert e['model_fitted'] is False and e['raw_records_exported'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ech01a-and-ech02-focal-aggregate
          path: source_receipt/*.json
          retention-days: 90
