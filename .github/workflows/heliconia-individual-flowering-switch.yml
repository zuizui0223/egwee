name: Heliconia same-individual flowering state audit

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/audit_heliconia_individual_flowering_switch.py'
      - 'scripts/audit_heliconia_forward_lag_prediction.py'
      - '.github/workflows/heliconia-individual-flowering-switch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit flowering positive-record transitions for same plant IDs
        run: python scripts/audit_heliconia_individual_flowering_switch.py --output build/heliconia_individual_flowering_switch.json
      - uses: actions/upload-artifact@v4
        with:
          name: heliconia-individual-flowering-switch
          path: build/heliconia_individual_flowering_switch.json
          if-no-files-found: error
