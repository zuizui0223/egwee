name: Heliconia external stage and missingness audit

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/analyze_heliconia_census_panel.py'
      - '.github/workflows/heliconia-external-stage-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct pinned external census diagnostic
        run: python scripts/analyze_heliconia_census_panel.py --json-out build/heliconia_external_stage_audit.json
      - name: Archive exploratory plot-level output
        uses: actions/upload-artifact@v4
        with:
          name: heliconia-external-stage-diagnostic
          path: build/heliconia_external_stage_audit.json
          if-no-files-found: error
