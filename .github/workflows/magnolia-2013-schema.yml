name: Magnolia 2013 population schema gate

on:
  pull_request:
    paths:
      - 'manuscript/MAGNOLIA_2013_POPULATION_CLUSTER_RECOVERY_CONTRACT.md'
      - 'scripts/inspect_magnolia_2013_table1_schema.py'
      - '.github/workflows/magnolia-2013-schema.yml'
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect open PMC Table 1 schema only
        run: python scripts/inspect_magnolia_2013_table1_schema.py
