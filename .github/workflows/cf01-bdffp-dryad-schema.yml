name: Inspect CF01 BDFFP Dryad schema

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/inspect_cf01_bdffp_dryad_schema.py'
      - '.github/workflows/cf01-bdffp-dryad-schema.yml'
      - 'manuscript/CF01_BDFFP_SEED_RAIN_2020_RECOVERY_CONTRACT.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install --quiet openpyxl
      - name: Download public Dryad files through browser-equivalent session
        run: |
          set -euo pipefail
          landing='https://datadryad.org/dataset/doi:10.5061/dryad.612jm640h'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/139 Safari/537.36'
          mkdir -p /tmp/bdffp_dryad
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent "$ua" \
            --cookie-jar /tmp/dryad.cookies \
            "$landing" \
            -o /tmp/dryad_landing.html

          fetch_xlsx () {
            id="$1"
            out="$2"
            curl --fail --location --retry 3 --retry-delay 2 \
              --user-agent "$ua" \
              --cookie /tmp/dryad.cookies \
              --cookie-jar /tmp/dryad.cookies \
              --referer "$landing" \
              "https://datadryad.org/downloads/file_stream/$id" \
              -o "$out"
            if ! unzip -t "$out" >/dev/null 2>&1; then
              echo "Dryad returned a non-XLSX payload for file_stream/$id"
              file "$out" || true
              head -c 200 "$out" | strings | head -n 8 || true
              return 1
            fi
          }

          fetch_xlsx 243392 /tmp/bdffp_dryad/density.rich.data.xlsx
          fetch_xlsx 243394 /tmp/bdffp_dryad/dispersed.matrix.xlsx
          fetch_xlsx 243393 /tmp/bdffp_dryad/functional.diversity.xlsx
          fetch_xlsx 243395 /tmp/bdffp_dryad/undispersed.matrix.xlsx

          (cd /tmp/bdffp_dryad && zip -q /tmp/bdffp_dryad.zip *.xlsx)
          unzip -t /tmp/bdffp_dryad.zip
      - name: Inspect schema only
        run: python scripts/inspect_cf01_bdffp_dryad_schema.py /tmp/bdffp_dryad.zip
      - name: Commit schema gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/meta_extraction/phase2_cf01_bdffp_dryad_schema_v1.json \
            manuscript/PHASE2_CF01_BDFFP_DRYAD_SCHEMA_2026-09-24.md
          if git diff --cached --quiet; then
            echo 'No BDFFP schema changes'
          else
            git commit -m 'Inspect CF01 BDFFP Dryad schema'
            git pull --rebase origin meta/systematic-coverage-moderator-expansion-2026-09-16
            git push origin HEAD:meta/systematic-coverage-moderator-expansion-2026-09-16
          fi
