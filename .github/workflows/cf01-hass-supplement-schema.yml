name: Inspect CF01 Hass supplement schema

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/inspect_cf01_hass_supplement_schema.py'
      - '.github/workflows/cf01-hass-supplement-schema.yml'
      - 'manuscript/CF01_HASS_WEUROPE_2018_GRADIENT_RECOVERY_CONTRACT.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install --quiet openpyxl
      - name: Inspect public S3 schema
        run: python scripts/inspect_cf01_hass_supplement_schema.py
      - name: Commit schema gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/meta_extraction/phase2_cf01_hass_supplement_schema_v1.json \
            manuscript/PHASE2_CF01_HASS_SUPPLEMENT_SCHEMA_2026-09-24.md
          if git diff --cached --quiet; then
            echo 'No Hass schema changes'
          else
            git commit -m 'Inspect CF01 Hass supplement schema'
            git pull --rebase origin meta/systematic-coverage-moderator-expansion-2026-09-16
            git push origin HEAD:meta/systematic-coverage-moderator-expansion-2026-09-16
          fi
