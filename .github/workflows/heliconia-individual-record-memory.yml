name: Heliconia individual reproductive-record memory transfer

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/audit_heliconia_individual_record_memory_transfer.py'
      - '.github/workflows/heliconia-individual-record-memory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify held-year scores and size-stratified individual flowering memory
        run: python scripts/audit_heliconia_individual_record_memory_transfer.py --output build/heliconia_record_memory_transfer_v1.json
      - name: Archive source checked stratification and held-year scores
        uses: actions/upload-artifact@v4
        with:
          name: heliconia-record-memory-transfer-v1
          path: build/heliconia_record_memory_transfer_v1.json
          if-no-files-found: error
