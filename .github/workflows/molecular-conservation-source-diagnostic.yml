name: Molecular conservation source and join gates
on:
  pull_request:
    paths:
      - 'research/molecular_conservation/**'
      - '.github/workflows/molecular-conservation-source-diagnostic.yml'
  workflow_dispatch:
jobs:
  source-and-join-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-only molecular/functional join-gate fixtures
        run: python -m unittest discover -s research/molecular_conservation -p 'test_*.py' -v
      - name: Verify 2026 Lupinus in-situ public source metadata and headers only
        run: |
          mkdir -p source_receipt
          python research/molecular_conservation/audit_lupinus_2026_in_situ_source.py > source_receipt/lupinus_2026_in_situ_schema.json
      - name: Compare 2025 and 2026 genotype/lineage ID labels, never outcomes
        run: |
          python research/molecular_conservation/audit_lupinus_2025_2026_id_linkage.py > source_receipt/lupinus_2025_2026_id_gate.json
          python - <<'PY'
          import json
          r=json.load(open('source_receipt/lupinus_2025_2026_id_gate.json'))
          assert r['snp_genotypes_read'] is False
          assert r['outcome_columns_read'] is False
          assert r['phenotype_values_read'] is False
          assert r['raw_data_exported'] is False
          assert r['direct_maternal_lineage_link_confirmed'] is False
          assert r['decision'] in (
            'SOURCE_PEDIGREE_CROSSWALK_REQUIRED_BEFORE_ANY_CROSS_YEAR_EFFECT',
            'SOURCE_ACCESS_OR_SCHEMA_STOP')
          print('Interannual ID source audit:',r['status'])
          if r['status']=='SOURCE_ID_AND_LINE_LABELS_ONLY_NO_OUTCOMES':
              print('2025/2026 rows:',r['2025_source_rows'],r['2026_source_rows'])
              print('Shared population×line categories:',r['shared_population_line_category_count'])
              print('Exact interannual ID-label overlap:',r['exact_id_label_overlap_across_generations'])
              print('Actual pedigree link: NOT VERIFIED')
          PY
      - name: Enforce no original observations, genetic calls or effects were exported
        run: |
          python - <<'PY'
          import json
          x=json.load(open('source_receipt/lupinus_2026_in_situ_schema.json'))
          assert x['article_id']==29606180
          assert x['raw_files_redistributed'] is False
          assert x['nonheader_outcome_values_read'] is False
          assert x['genotype_values_read'] is False
          assert x['source_individual_join_verified'] is False
          assert x['new_effect_estimated'] is False
          assert x['independent_biological_programmes_added']==0
          assert x['status'] in ('SOURCE_METADATA_VERIFIED','SOURCE_METADATA_STOP')
          assert all(f['schema_status'] in (
            'XLSX_FIRST_ROW_AND_COUNTS_ONLY',
            'METADATA_ONLY_UNSUPPORTED_OR_SIZE_LIMIT',
            'DOWNLOAD_OR_SCHEMA_STOP') for f in x['files'])
          print('Lupinus 2026 source status:',x['status'])
          print('Files listed:',len(x['files']))
          print('XLSX headers verified:',sum(f['schema_status']=='XLSX_FIRST_ROW_AND_COUNTS_ONLY' for f in x['files']))
          def normal(t): return str(t).strip().lower().replace(' ','_')
          known={'id','plant_id','genotype','population','origin','site','line',
                 'family','mother','mother_id','year','date','treatment',
                 'flowering_onset','flowering_time','onset_date','shoot_growth',
                 'number_of_seeds','seed_number','seed_count','seed_set',
                 'seed_weight','fruit_set','fruit_number','survival',
                 'germination','recruitment','pollinator_visit','pollen_deposition'}
          for f in x['files']:
              for sh in f.get('sheets',[]):
                  headers={normal(t) for t in sh.get('first_row_headers',[])}
                  print('Schema-only:',f['filename'],'sheet',sh['worksheet'],
                        'physical_rows',sh['physical_rows'],
                        'recognized_field_headers',sorted(headers & known),
                        'header_cell_count',len(headers))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: molecular-source-2026-lupinus-only
          path: source_receipt/*.json
          retention-days: 30
