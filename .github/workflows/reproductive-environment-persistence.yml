name: EGWEE reproductive environment persistence
on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/audit_reproductive_environment_persistence_20261019.py'
      - '.github/workflows/reproductive-environment-persistence.yml'
      - 'evidence/meta_extraction/wandoo_reproductive_stages_20261019_table1.csv'
      - 'evidence/meta_extraction/wandoo_reproductive_stages_20261019_table6.csv'
      - 'evidence/meta_extraction/phase2_cf01_cardiopetalum_table1_v1.csv'
  pull_request:
    paths:
      - 'scripts/audit_reproductive_environment_persistence_20261019.py'
      - '.github/workflows/reproductive-environment-persistence.yml'
      - 'manuscript/REPRODUCTIVE_ENVIRONMENT_PERSISTENCE_2026-10-19.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric libraries
        run: python -m pip install --quiet numpy scipy
      - name: Recover temporal and conditional robustness
        run: python scripts/audit_reproductive_environment_persistence_20261019.py --output reproductive_environment_persistence.json
      - uses: actions/upload-artifact@v4
        with:
          name: reproductive-environment-persistence
          path: reproductive_environment_persistence.json
