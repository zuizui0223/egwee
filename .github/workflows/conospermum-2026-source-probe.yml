name: Conospermum 2026 source probe

on:
  pull_request:
    paths:
      - 'manuscript/CONOSPERMUM_2026_CLUSTER_RECOVERY_CONTRACT.md'
      - 'scripts/probe_conospermum_2026_sources.py'
      - 'scripts/inspect_conospermum_2026_sources.py'
      - '.github/workflows/conospermum-2026-source-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install raw-data readers
        run: python -m pip install --quiet openpyxl
      - name: Probe locked Dryad and exposure-source routes
        run: python scripts/probe_conospermum_2026_sources.py
      - name: Inspect locked source schemas
        run: python scripts/inspect_conospermum_2026_sources.py
