name: Brosimum genetic reconciliation

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/check_brosimum_genetic_reconciliation.py'
      - '.github/workflows/brosimum-genetic-reconciliation.yml'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install --quiet openpyxl
      - name: Reconcile raw genotype H_O with publication Table 2
        run: python scripts/check_brosimum_genetic_reconciliation.py
