name: Historical four-gate submission bundle (inactive)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-historical-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Explain inactive status
        run: |
          echo "This workflow reproduces the superseded four-gate Ecological Indicators package for provenance only."
          echo "The active EGWEE publication route is the multilayer fragmentation meta-analysis."

      - name: Validate locked historical six-system inference boundary
        run: python scripts/validate_unreachable_six.py

      - name: Build deterministic historical submission bundle
        run: |
          python scripts/build_ecological_indicators_submission_final.py \
            --repo-root . \
            --output ecological_indicators_submission_historical

      - name: Verify historical package
        run: |
          test -s ecological_indicators_submission_historical/MANIFEST.sha256
          test -s ecological_indicators_submission_historical/manuscript/main_text.md
          test -s ecological_indicators_submission_historical/manuscript/cover_letter.md
          test -s ecological_indicators_submission_historical/manuscript/highlights.txt

      - name: Upload historical provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: egwee-four-gate-historical-submission
          path: ecological_indicators_submission_historical/
          if-no-files-found: error
