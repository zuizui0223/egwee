name: QPF007 post-outcome genetic mate-pair equal null and chains
on:
  push:
    branches: [analysis/qpf007-contact-null-calibration-20261119]
  pull_request:
    paths:
      - research/qpf_independent_2026/QPF007_POSTHOC_UNIQUE_PAIR_AND_CHAIN_FREEZE_20261119.md
      - research/qpf_independent_2026/audit_qpf007_posthoc_unique_partner_mcmc.py
      - .github/workflows/qpf007-unique-pair-null-diagnostic.yml
  workflow_dispatch:
jobs:
  original-paternity-pair-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check exact mother-father pair deduplication on synthetic data
        run: python research/qpf_independent_2026/audit_qpf007_posthoc_unique_partner_mcmc.py --self-test
      - name: Run independent original-source partner-equal fixed-marginal MCMC audit
        run: |
          python research/qpf_independent_2026/audit_qpf007_posthoc_unique_partner_mcmc.py \
            --output qpf007_postoutcome_unique_pair_chain_derivative.json
          python - <<'PY'
          import json
          r=json.load(open("qpf007_postoutcome_unique_pair_chain_derivative.json"))
          assert r["status"]=="QPF007_POSTOUTCOME_UNIQUE_MOTHER_FATHER_PAIR_SENSITIVITY_COMPLETE"
          assert r["source_original_distinct_outcross_genetic_pairs"]==303
          assert r["original_outcrossed_genotyped_offspring"]==741
          assert abs(r["original_frozen_child_weighted_contact_fraction"]-688/741)<1e-12
          assert r["original_10flower_carryover_choice_unchanged"] is True
          assert r["original_primary_marginal_null_not_refit_or_redefined"] is True
          assert r["this_is_postoutcome_and_not_independent_confirmation"] is True
          assert r["source_original_rows_and_genotype_IDs_redistributed"] is False
          assert r["two_separate_RNG_seeded_chains"]==[20261121,20261122]
          assert r["null_draws_per_chain"]==2000
          print("QPF007_POSTPRIMARY_PAIR_EQUAL_SENSITIVITY_NO_PRIMARY_REPLACEMENT_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qpf007-postoutcome-unique-pair-two-chain-aggregate
          path: qpf007_postoutcome_unique_pair_chain_derivative.json
          retention-days: 14
