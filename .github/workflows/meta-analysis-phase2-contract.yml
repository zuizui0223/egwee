jobs:
  phase2-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Parkia Phase-2 pair recovery
        run: python scripts/check_phase2_sf05_93_parkia.py
      - name: Validate Heliconia Phase-2 multilayer recovery
        run: python scripts/check_phase2_sf05_71_heliconia.py
      - name: Validate Prunus Phase-2 G-pair recovery
        run: python scripts/check_phase2_cf01_prunus_2014.py
      - name: Validate systematic coverage and moderator expansion contract
        run: python scripts/check_systematic_coverage_expansion_contract.py
