name: Genetic-function rescue public-data schema gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/rescue_coupling/**'
      - '.github/workflows/genetic-function-rescue-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-clarke-published-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the pinned published Excel workbook (never redistribute raw)
        run: |
          mkdir -p /tmp/genetic_rescue_source
          curl --fail --location --silent --show-error --retry 3 \
            --max-time 60 \
            "https://raw.githubusercontent.com/AdamCSmithCWS/Genetic_rescue_meta/61c59003a66580f5ba090de46dd8614008373cb7/He_dGR.xlsx" \
            --output /tmp/genetic_rescue_source/He_dGR.xlsx
          test -s /tmp/genetic_rescue_source/He_dGR.xlsx

      - name: Audit study, outcome schema and independent denominators WITHOUT reading effect signs
        run: |
          python research/rescue_coupling/audit_clarke_schema.py \
            --source /tmp/genetic_rescue_source/He_dGR.xlsx \
            --output rescue_schema_artifact/clarke_2024_schema_only.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("rescue_schema_artifact/clarke_2024_schema_only.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["status"]=="SCHEMA_ONLY_NO_EFFECT_VALUES_OPENED"
          assert j["unique_original_studies_complete"]>0
          assert j["complete_original_author_slice_rows"]>=j["unique_original_studies_complete"]
          s=p.read_text(encoding="utf-8")
          assert '"Pre_He":' not in s and '"Post_fit":' not in s
          print("Schema-only audit and non-disclosure checks passed")
          PY

      - name: Apply locked endpoint ontology WITHOUT looking at effect directions
        run: |
          python research/rescue_coupling/classify_clarke_endpoints.py \
            --schema rescue_schema_artifact/clarke_2024_schema_only.json \
            --codebook research/rescue_coupling/CLARKE_ENDPOINT_CODEBOOK_20261115.json \
            --output rescue_schema_artifact/clarke_2024_endpoint_gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("rescue_schema_artifact/clarke_2024_endpoint_gate.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["status"]=="ENDPOINT_CLASSIFIED_NO_EFFECT_DIRECTIONS_OPENED"
          assert j["paired_population_comparison_rows"]==27
          assert j["independent_source_studies"]==19
          assert j["endpoint_rows_by_original_code"]=={"IR":3,"PS":20,"SR":4}
          assert j["direct_ecological_function_confirmed_from_aggregate_source"]==0
          assert j["reproductive_success_rows_for_source_level_screen"]==3
          assert j["reproductive_success_unique_source_studies"]==2
          assert j["reproductive_success_source_studies"]==["Arrendal (2004)","Gustafson (2017)"]
          assert j["same_numeric_post_generation_rows"]==19
          assert j["different_numeric_post_generation_rows"]==8
          assert j["genetic_fitness_same_generation_rows"]==19
          assert j["genetic_fitness_different_generation_rows"]==8
          assert j["genetic_fitness_timing_unresolved_rows"]==0
          PY

      - name: Validate source-screened plant candidate ledger and independent programme grain
        run: |
          python research/rescue_coupling/audit_plant_candidate_registry.py \
            --registry research/rescue_coupling/plant_primary_candidate_registry_v1.json \
            --clarke rescue_schema_artifact/clarke_2024_endpoint_gate.json \
            --output rescue_schema_artifact/plant_candidate_evidence_map_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("rescue_schema_artifact/plant_candidate_evidence_map_v1.json").read_text())
          assert result["status"]=="SCREENED_CANDIDATE_EVIDENCE_MAP_NO_POOLED_META"
          assert result["publication_records_total"]==10
          assert result["independent_study_programme_keys_total"]==8
          assert result["potentially_independent_primary_empirical_programmes"]==6
          assert result["primary_empirical_publications_in_candidate_registry"]==8
          assert result["aggregated_existing_review_records"]==1
          assert result["simulation_records_excluded_from_empirical_meta"]==1
          assert result["currently_meta_ready_programmes_with_matched_raw_G_F_effects"]==0
          assert result["molecular_and_direct_function_n_published_programmes"]==1
          assert result["raw_same_unit_linkage_verified_and_effects_estimated"]==0
          PY

      - name: Probe public Pyrus Dryad workbook sheet schema (no effect values)
        run: |
          python research/rescue_coupling/audit_pyrus_dryad_schema.py \
            --output rescue_schema_artifact/pyrus_2019_dryad_schema_probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("rescue_schema_artifact/pyrus_2019_dryad_schema_probe.json").read_text())
          assert x["doi"]=="doi:10.5061/dryad.6t72p3j"
          assert x["outcome_values_opened"] is False
          assert x["uncontrolled_effect_estimated"] is False
          assert x["data_redistributed"] is False
          assert x["decision"] in (
              "SHEET_SCHEMA_ONLY_REVIEW_TREATMENT_GRAIN_BEFORE_OUTCOME",
              "ACCESS_STOP_NO_RAW_COHORT_LINKAGE_CLAIM",
              "DATA_FORMAT_STOP_REVIEW_FILE_METADATA"
          )
          print("Source access status:",x["schema_status"],x["decision"])
          PY

      - name: Probe public Figshare molecular source files (headers only; no effect values)
        run: |
          python research/rescue_coupling/audit_figshare_schema.py \
            --output rescue_schema_artifact/figshare_plant_genomic_source_schema.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("rescue_schema_artifact/figshare_plant_genomic_source_schema.json").read_text())
          assert j["status"]=="METADATA_AND_FIRST_ROW_SCHEMA_ONLY_NO_OUTCOME_VALUES"
          assert j["candidate_effect_size_claims"]==0 and j["raw_data_redistributed"] is False
          assert {s["article_id"] for s in j["sources"]}=={30290722,28304024}
          assert all(s["decision"] in ("FIGSHARE_FILES_REVIEWED_NO_EFFECT_VALUES","FIGSHARE_ACCESS_STOP") for s in j["sources"])
          PY

      - name: Check exact sample-ID overlap for Lupinus phenotypes and SNP metadata (blinded)
        run: |
          python research/rescue_coupling/audit_lupinus_id_linkage.py \
            --output rescue_schema_artifact/lupinus_2025_id_linkage_gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("rescue_schema_artifact/lupinus_2025_id_linkage_gate.json").read_text())
          assert j["status"]=="LUPINUS_ID_ONLY_NO_OUTCOME_VALUES"
          assert j["outcome_values_read"] is False
          assert j["vcf_genotypes_read"] is False
          assert j["raw_files_redistributed"] is False
          assert j["phenotype_unique_identifiers"]>0
          assert j["vcf_metadata_unique_identifiers"]>0
          assert j["decision"] in ("ID_LINKAGE_REQUIRES_SOURCE_CROSSWALK","EXACT_ID_MATCHES_EXIST_CHECK_UNIT_AND_LAG_BEFORE_EFFECTS")
          PY

      - name: Audit Pseudoziziphus genotype and transplant survival identifiers without outcomes
        run: |
          python research/rescue_coupling/audit_ziziphus_id_linkage.py \
            --output rescue_schema_artifact/ziziphus_2025_id_linkage_gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("rescue_schema_artifact/ziziphus_2025_id_linkage_gate.json").read_text())
          assert j["status"]=="ZIZIPHUS_IDENTIFIER_AND_TREATMENT_SCHEMA_ONLY"
          assert j["survival_long_records"]>=j["popcode_plant_id_composite_nonempty_rows"]>0
          assert j["unique_popcode_plant_id_composite_keys"]>0
          assert j["unique_popcode_plant_id_composite_keys"]<=j["popcode_plant_id_composite_nonempty_rows"]
          assert j["plant_id_label_nonempty_rows"]+j["plant_id_label_missing_rows"]==j["survival_long_records"]
          assert j["popcode_plant_id_composite_nonempty_rows"]+j["popcode_plant_id_composite_missing_rows"]==j["survival_long_records"]
          assert j["composite_key_is_a_candidate_not_yet_a_verified_independent_unit"] is True
          assert j["biological_outcome_fields_read"] is False
          assert j["genotype_allele_fields_read"] is False
          assert j["raw_data_redistributed"] is False
          assert j["decision"] in ("VERIFY_RAW_ID_CROSSWALK_FROM_SOURCE_DICTIONARY","CHECK_SEMANTIC_ID_MAPPING_BEFORE_JOIN")
          PY

      - name: Inspect full Genodive published samples and bound cross-file ID join
        run: |
          python research/rescue_coupling/audit_ziziphus_genodive_sample_ids.py \
            --output rescue_schema_artifact/ziziphus_2025_genodive_id_gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("rescue_schema_artifact/ziziphus_2025_genodive_id_gate.json").read_text(encoding="utf-8"))
          assert j["status"]=="PUBLISHED_GENODIVE_SOURCE_IDENTIFIER_AUDIT"
          assert j["source_id"]==58525312
          assert j["outcome_values_read"] is False
          assert j["microsatellite_alleles_read"] is False
          assert j["source_raw_data_redistributed"] is False
          assert j["join_verdict"] in ("UNVERIFIED_SEMANTIC_CROSSWALK_REQUIRED","FORMAT_STOP_SOURCE_DESCRIPTION_REQUIRED")
          if j["parse_status"]=="GENODIVE_SAMPLE_NAMES_ONLY_VERIFIED":
              assert j["declared_observed_count_consistent"]
              assert j["declared_individuals"]==1120
              assert j["declared_populations"]==12
              assert j["declared_loci"]==12
              assert j["distinct_sample_name_labels"]==1120
              assert j["nonempty_sample_name_records"]==1120
              assert j["genotype_fields_not_read"] is True
              assert j["genodive_population_names_not_exposed_in_artifact"] is True
              assert j["overlap_sample_to_survival_labels"]=={"plant_id":0,"genotype":0,"Rgenotype":0}
          PY

      - name: Audit independent Dianthus genotype/fitness and Arnica fitness Zenodo records
        run: |
          python research/rescue_coupling/audit_zenodo_genetic_fitness_schema.py \
            --output rescue_schema_artifact/dianthus_arnica_zenodo_source_schemas.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("rescue_schema_artifact/dianthus_arnica_zenodo_source_schemas.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["status"]=="PUBLIC_ZENODO_SCHEMA_ONLY_NO_OUTCOME_VALUES"
          assert d["source_record_count"]==3 and d["independent_study_programmes"]==2
          assert {r["id"] for r in d["records"]}=={4650464,4650488,3881439}
          assert d["raw_data_redistributed"] is False
          assert d["alleles_read"] is False
          assert d["fitness_effects_computed"] is False
          assert all(r["decision"] in (
            "PUBLIC_SOURCE_SCHEMAS_ONLY_NO_GENETIC_FUNCTION_LINK_ESTIMATED",
            "ZENODO_SOURCE_ACCESS_STOP") for r in d["records"])
          PY

      - name: Audit Dianthus genomic source against F0 flowering/seed and F1 seedlings by exact ID
        run: |
          python research/rescue_coupling/audit_dianthus_genome_fitness_ids.py \
            --output rescue_schema_artifact/dianthus_2021_genome_fitness_id_gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("rescue_schema_artifact/dianthus_2021_genome_fitness_id_gate.json").read_text())
          assert d["status"]=="DIANTHUS_F0_F1_SOURCE_ID_LINKAGE_AUDIT_NO_PHENOTYPES_OPENED"
          assert d["genotype_record_rows"]==1173
          assert d["fitness_flowering_record_rows"]==619
          assert d["fitness_seed_record_rows"]==125
          assert d["fitness_F1_juvenile_record_rows"]==1171
          assert d["outcome_fields_read"] is False
          assert d["microsatellite_alleles_read"] is False
          assert d["raw_data_redistributed"] is False
          assert set(d["comparisons"])=={"F0_flowering","F0_seed","F1_juvenile"}
          h=d["phenotype_cohort_identifier_linkage"]
          assert h["F1_repeated_local_seedling_code_unique"]<=d["fitness_F1_juvenile_record_rows"]
          assert h["F1_unique_full_mother_child_text_keys"]>=h["F1_repeated_local_seedling_code_unique"]
          assert h["F1_unique_full_mother_child_text_keys"]<=d["fitness_F1_juvenile_record_rows"]
          assert h["mother_child_is_provisional_text_key"] is True
          assert h["do_not_promote_to_independent_cohort_without_source_crosswalk"] is True
          PY

      - name: Audit Dianthus F0 maternal and F1 offspring same-workbook identifier joins
        run: |
          python research/rescue_coupling/audit_dianthus_within_fitness_maternal_ids.py \
            --output rescue_schema_artifact/dianthus_2021_maternal_fitness_id_gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("rescue_schema_artifact/dianthus_2021_maternal_fitness_id_gate.json").read_text())
          assert a["status"]=="DIANTHUS_FITNESS_WORKBOOK_INTERNAL_IDS_NO_GENOTYPES_OR_OUTCOMES_OPENED"
          assert a["source_fitness_flowering_rows"]==619
          assert a["source_fitness_seed_rows"]==125
          assert a["source_fitness_F1_growth_rows"]==1171
          assert a["HL_column_exists_in_F0_flowering"] is True
          assert a["HL_column_exists_in_F1_seedling_growth"] is True
          assert a["HL_column_absent_from_F0_seed_sheet"] is True
          assert a["outcome_values_read"] is False
          assert a["HL_values_read"] is False
          assert a["genotype_alleles_read"] is False
          assert a["third_party_source_redistributed"] is False
          PY

      - name: Upload derivative metadata only
        uses: actions/upload-artifact@v4
        with:
          name: rescue-coupling-clarke-schema
          path: rescue_schema_artifact/*.json
          retention-days: 30
          if-no-files-found: error

