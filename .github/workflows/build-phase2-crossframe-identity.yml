name: Build Phase-2 cross-frame identity ledger

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/build_phase2_crossframe_identity_ledger.py'
      - '.github/workflows/build-phase2-crossframe-identity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build outcome-blind cross-frame publication ledger
        run: python scripts/build_phase2_crossframe_identity_ledger.py
      - name: Commit identity ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/meta_extraction/phase2_crossframe_publication_identity_v1.csv \
            evidence/meta_extraction/phase2_crossframe_candidate_duplicates_v1.csv \
            evidence/meta_extraction/phase2_crossframe_identity_summary_v1.json \
            manuscript/PHASE2_CROSSFRAME_IDENTITY_LEDGER_2026-09-20.md
          if git diff --cached --quiet; then
            echo 'No cross-frame identity changes'
          else
            git commit -m 'Build Phase-2 cross-frame publication identity ledger'
            git push origin HEAD:meta/systematic-coverage-moderator-expansion-2026-09-16
          fi
