name: Heliconia regional NASA POWER context

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/audit_heliconia_regional_climate_context.py'
      - '.github/workflows/heliconia-regional-climate-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch NASA POWER single-grid historical climate and archive metadata
        run: python scripts/audit_heliconia_regional_climate_context.py --output build/heliconia_regional_climate_context_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: heliconia-regional-climate-context
          path: build/heliconia_regional_climate_context_v1.json
          if-no-files-found: error
