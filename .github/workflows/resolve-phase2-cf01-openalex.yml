name: Resolve Phase-2 CF01 bibliography

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve seed bibliography through OpenAlex
        run: python scripts/resolve_phase2_cf01_openalex.py
      - name: Commit bibliographic resolution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/meta_extraction/phase2_cf01_bibliographic_resolution_v1.csv \
            evidence/meta_extraction/phase2_cf01_bibliographic_resolution_summary_v1.json \
            manuscript/PHASE2_CF01_BIBLIOGRAPHIC_RESOLUTION_2026-09-21.md
          if git diff --cached --quiet; then
            echo 'No CF01 bibliographic changes'
          else
            git commit -m 'Resolve Phase-2 CF01 bibliography'
            git pull --rebase origin meta/systematic-coverage-moderator-expansion-2026-09-16
            git push origin HEAD:meta/systematic-coverage-moderator-expansion-2026-09-16
          fi
