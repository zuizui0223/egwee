name: Heliconia strict forward-year recruitment audit

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/audit_heliconia_forward_lag_prediction.py'
      - 'scripts/analyze_heliconia_census_panel.py'
      - '.github/workflows/heliconia-forward-lag-prediction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-pinned forward-year and lag check
        run: python scripts/audit_heliconia_forward_lag_prediction.py --output build/heliconia_forward_lag_v1.json
      - name: Archive scored model comparisons
        uses: actions/upload-artifact@v4
        with:
          name: heliconia-forward-lag-v1
          path: build/heliconia_forward_lag_v1.json
          if-no-files-found: error
