name: Primula 2025 common-exposure schema gate

on:
  pull_request:
    paths:
      - 'manuscript/PRIMULA_2025_CLUSTER_RECOVERY_CONTRACT.md'
      - 'scripts/inspect_primula_2025_supplement_schema.py'
      - '.github/workflows/primula-2025-schema.yml'
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document reader
        run: python -m pip install --quiet python-docx
      - name: Inspect supplement schema only
        run: python scripts/inspect_primula_2025_supplement_schema.py
