name: Probe SF07 Dryad metadata

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - '.github/workflows/probe-sf07-dryad-metadata.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public dataset metadata
        run: |
          set -euxo pipefail
          DATASET='https://datadryad.org/api/v2/datasets/doi%3A10.5061%2Fdryad.dz08kps9p'
          curl --fail --location --silent --show-error --header 'Accept: application/json' "$DATASET" -o /tmp/dataset.json
          cat /tmp/dataset.json
          echo
          curl --fail --location --silent --show-error --header 'Accept: application/json' "$DATASET/versions" -o /tmp/versions.json
          cat /tmp/versions.json
          echo
          VERSION_ID="$(python -c "import json; o=json.load(open('/tmp/versions.json')); xs=o.get('_embedded',{}).get('stash:versions') or o.get('versions') or []; assert xs; print(max(int(x.get('id') or str(x.get('_links',{}).get('self',{}).get('href','')).rstrip('/').split('/')[-1]) for x in xs))")"
          echo "VERSION_ID=$VERSION_ID"
          curl --fail --location --silent --show-error --header 'Accept: application/json' "https://datadryad.org/api/v2/versions/$VERSION_ID/files" -o /tmp/files.json
          cat /tmp/files.json
          echo
          python -c "import json; o=json.load(open('/tmp/files.json')); xs=o.get('_embedded',{}).get('stash:files') or o.get('files') or []; print('SF07_FILE_LIST_START'); [print({'id':x.get('id'),'path':x.get('path'),'size':x.get('size'),'mimeType':x.get('mimeType'),'download':x.get('_links',{}).get('stash:download',{}).get('href') or x.get('_links',{}).get('download',{}).get('href'),'self':x.get('_links',{}).get('self',{}).get('href')}) for x in xs]; print('SF07_FILE_LIST_END')"
      - name: Probe public Richness download routes
        run: |
          set -u
          LANDING='https://datadryad.org/dataset/doi:10.5061/dryad.dz08kps9p'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          curl --location --silent --show-error --user-agent "$UA" --cookie-jar /tmp/dryad.cookies "$LANDING" -o /tmp/landing.html
          for URL in \
            'https://datadryad.org/api/v2/files/4257013/download' \
            'https://datadryad.org/downloads/file_stream/4257013' \
            'https://datadryad.org/stash/downloads/file_stream/4257013'
          do
            rm -f /tmp/probe.bin
            CODE="$(curl --location --silent --show-error \
              --user-agent "$UA" \
              --referer "$LANDING" \
              --cookie /tmp/dryad.cookies \
              --output /tmp/probe.bin \
              --write-out '%{http_code}' \
              "$URL" || true)"
            SIZE="$(wc -c < /tmp/probe.bin 2>/dev/null || echo 0)"
            TYPE="$(file -b /tmp/probe.bin 2>/dev/null || true)"
            echo "SF07_RICHNESS_ROUTE code=$CODE size=$SIZE type=$TYPE url=$URL"
          done
      - name: Inspect linked Zenodo analysis code
        run: |
          set -euxo pipefail
          curl --fail --location --silent --show-error \
            'https://zenodo.org/records/16903422/files/Habitat_fragmentation_2025.R?download=1' \
            -o /tmp/Habitat_fragmentation_2025.R
          test -s /tmp/Habitat_fragmentation_2025.R
          wc -c /tmp/Habitat_fragmentation_2025.R
          grep -nEi 'read[._]?csv|read\.table|Richness_20250627|Abundance_20250630|dryad|zenodo|Publication|Reference|Title' \
            /tmp/Habitat_fragmentation_2025.R || true

