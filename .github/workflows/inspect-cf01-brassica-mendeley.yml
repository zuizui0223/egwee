name: Inspect CF01 Brassica Mendeley schema

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'manuscript/CF01_BRASSICA_GUATEMALA_2024_RECOVERY_CONTRACT.md'
      - 'scripts/inspect_cf01_brassica_mendeley.py'
      - '.github/workflows/inspect-cf01-brassica-mendeley.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install --quiet openpyxl
      - name: Inspect Mendeley public dataset schema
        run: python scripts/inspect_cf01_brassica_mendeley.py
      - name: Commit schema audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/meta_extraction/phase2_cf01_brassica_mendeley_manifest_v1.json \
            manuscript/PHASE2_CF01_BRASSICA_MENDELEY_SCHEMA_2026-09-24.md
          if git diff --cached --quiet; then
            echo 'No Brassica schema changes'
          else
            git commit -m 'Inspect Brassica Mendeley schema'
            git pull --rebase origin meta/systematic-coverage-moderator-expansion-2026-09-16
            git push origin HEAD:meta/systematic-coverage-moderator-expansion-2026-09-16
          fi
