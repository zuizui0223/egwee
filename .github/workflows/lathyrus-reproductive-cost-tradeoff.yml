name: Independent Lathyrus reproduction-growth tradeoff audit

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/audit_lathyrus_reproductive_cost_state_tradeoff.py'
      - 'scripts/audit_lathyrus_external_history_order.py'
      - '.github/workflows/lathyrus-reproductive-cost-tradeoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Lathyrus RData reader
        run: python -m pip install 'pyreadr>=0.5,<0.7' 'pandas>=2,<4'
      - name: Verify source and stage-specific observational reproductive tradeoffs
        run: python scripts/audit_lathyrus_reproductive_cost_state_tradeoff.py --output build/lathyrus_reproductive_cost_state_tradeoff.json
      - uses: actions/upload-artifact@v4
        with:
          name: lathyrus-reproductive-cost-stage-tradeoff
          path: build/lathyrus_reproductive_cost_state_tradeoff.json
          if-no-files-found: error
