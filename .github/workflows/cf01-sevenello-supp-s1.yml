name: Inspect CF01 Sevenello supplement Table S1

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/inspect_cf01_sevenello_supplement_table_s1.py'
      - '.github/workflows/cf01-sevenello-supp-s1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DOCX parser
        run: python -m pip install --quiet python-docx
      - name: Inspect supplementary Table S1 only
        run: python scripts/inspect_cf01_sevenello_supplement_table_s1.py
      - name: Commit Table S1 audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/meta_extraction/phase2_cf01_sevenello_supp_table_s1_v1.csv \
            manuscript/PHASE2_CF01_SEVENELLO_SUPP_TABLE_S1_2026-09-25.md
          if git diff --cached --quiet; then
            echo 'No Sevenello Table S1 changes'
          else
            git commit -m 'Inspect Sevenello supplementary Table S1'
            git pull --rebase origin meta/systematic-coverage-moderator-expansion-2026-09-16
            git push origin HEAD:meta/systematic-coverage-moderator-expansion-2026-09-16
          fi
