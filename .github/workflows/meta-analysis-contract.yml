  push:
    branches: [main]
    paths:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis readers
        run: python -m pip install --quiet openpyxl numpy
      - name: Validate protocol-first meta-analysis state
        run: python scripts/check_meta_analysis_contract.py
      - name: Validate systematic coverage and moderator expansion
        run: python scripts/check_systematic_coverage_expansion_contract.py
      - name: Validate corpus and extraction progress
        run: python scripts/check_meta_analysis_progress.py
      - name: Audit Spondias site-level paternity effect
        run: python scripts/check_spondias_paternity_effect.py
      - name: Audit Spondias cohort multilayer cluster
        run: python scripts/check_spondias_multilayer_cluster.py
      - name: Probe Spondias supplementary files
        run: python scripts/probe_spondias_supplement.py
      - name: Inspect Spondias supplementary tables
        run: python scripts/inspect_spondias_supplement.py
      - name: Audit Brosimum site-level effects
        run: python scripts/check_brosimum_extraction.py
      - name: Probe Brosimum public raw-data package
        run: python scripts/probe_brosimum_figshare.py
      - name: Inspect Brosimum raw workbook hierarchy
        run: python scripts/audit_brosimum_raw_workbook.py
      - name: Recover Brosimum site-level multilayer effects
        run: python scripts/recover_brosimum_multilayer_cluster.py
      - name: Audit reconstructable Serapias gradient effects
        run: python scripts/check_serapias_extraction.py
      - name: Audit source-defined Serapias paired multilayer effects
        run: python scripts/check_serapias_binary_effects.py
      - name: Audit multilayer cluster dependence contract
        run: python scripts/check_multilayer_cluster_contract.py
      - name: Audit cross-system C-F pilot
        run: python scripts/check_cross_system_cf_pilot.py
      - name: Audit Magnolia native-scale model extraction
        run: python scripts/check_magnolia_extraction.py
      - name: Check manuscript claim sync
        run: python scripts/check_manuscript_claim_sync.py
      - name: Check study recovery and admission flow
        run: python scripts/check_study_flow_transparency.py
      - name: Check statistical estimand and Fisher interpretation
        run: python scripts/check_statistical_estimand_contract.py
      - name: Audit authoritative estimand-scale robustness
        run: python scripts/check_estimand_scale_robustness.py
      - name: Audit cross-scale process-function geometry
        run: python scripts/check_bottleneck_scale_robustness.py
      - name: Audit I-F measurement-reliability sufficiency
        run: python scripts/check_if_reliability_sufficiency.py
      - name: Audit Wandoo interaction-provenance triangulation
        run: python scripts/check_wandoo_mating_provenance_triangulation.py
      - name: Audit interaction-provenance evidence hierarchy
        run: python scripts/check_interaction_provenance_context.py
      - name: Audit fragmentation translation decomposition
        run: python scripts/check_fragmentation_translation_decomposition.py
      - name: Audit effective reproductive-assurance context
        run: python scripts/check_effective_reproductive_assurance_context.py
      - name: Audit Myrtus stage-displacement and extinction-debt crosswalk
        run: python scripts/check_myrtus_stage_displacement.py
      - name: Audit qualitative process-function sign geometry
        run: python scripts/check_qualitative_process_function_sign_geometry.py
      - name: Audit scale-stable interaction-quantity proxy failure
        run: python scripts/check_scale_stable_quantity_function_proxy_failure.py
      - name: Audit transition-specific filtering topology
        run: python scripts/check_transition_specific_filtering.py
      - name: Audit ecological generality and hidden mating hypothesis
        run: python scripts/check_ecological_generality_and_surprise.py
      - name: Audit scale-stable interaction-function sign geometry
        run: python scripts/check_if_sign_geometry.py
      - name: Audit interaction-function sign uncertainty
        run: python scripts/check_if_sign_uncertainty.py
      - name: Audit frozen qualitative external I-F evidence
        run: python scripts/check_qualitative_external_if_audit.py
      - name: Audit frozen I-F translation non-identifiability
        run: python scripts/check_if_translation_map.py
      - name: Audit I-F translation influence
        run: python scripts/check_if_translation_influence.py
      - name: Audit I-F translation category sensitivity
        run: python scripts/check_if_translation_category_sensitivity.py
      - name: Audit I-F interaction-metric sensitivity
        run: python scripts/check_if_interaction_metric_sensitivity.py
      - name: Audit I-F sentinel determinism
        run: python scripts/check_if_sentinel_determinism.py
      - name: Audit I-F incremental sentinel value
        run: python scripts/check_if_sentinel_incremental_value.py
      - name: Audit fragmentation sentinel sufficiency
        run: python scripts/check_fragmentation_sentinel_sufficiency.py
      - name: Audit necessity and sufficiency of interaction decline
        run: python scripts/check_interaction_decline_necessity_sufficiency.py
      - name: Check covariance robustness and certification boundary
        run: python scripts/check_covariance_robustness.py
      - name: Validate unified ecological process-function census
        run: python scripts/check_ecological_process_function_programme_census.py
      - name: Validate bottleneck-direction influence
        run: python scripts/check_ecological_bottleneck_direction_influence.py
      - name: Validate complete ecological I-F direction census
        run: python scripts/check_ecological_if_programme_census.py
      - name: Validate ecological bottleneck-position audit
        run: python scripts/check_ecological_mating_function_programme_census.py
      - name: Validate fresh ecological I-F validation contract
        run: python scripts/check_fresh_ecological_if_validation_contract.py
      - name: Guard recruitment-stage source and opportunity arithmetic
        run: python scripts/check_stage_opportunity_ledger.py
      - name: Audit all 17 primary marginal effects
        run: python scripts/check_primary_effect_supplement.py
      - name: Build supplementary primary-effect forest
        run: python scripts/build_primary_effect_forest.py
      - name: Check Journal of Ecology submission shape
        run: python scripts/check_journal_of_ecology_submission_shape.py
      - name: Check double-anonymous manuscript
        run: python scripts/check_double_anonymous_submission.py
      - name: Build Journal of Ecology figures and Tables 1-2
        run: python scripts/build_journal_of_ecology_figures.py
      - name: Build anonymous reviewer code and data package
        run: python scripts/build_anonymous_review_package.py
      - name: Archive anonymous review package
        uses: actions/upload-artifact@v4
        with:
          name: anonymous-review-package
          path: build/anonymous_review_package.zip
          if-no-files-found: error
      # The publication freeze remains fail-closed, but should not mask upstream
      # scientific validation or artifact failures during an open revision.
      - name: Validate ecology-first submission freeze
        run: python scripts/check_submission_freeze.py
