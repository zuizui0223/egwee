      - 'docs/superpowers/plans/2026-09-17-egwee-systematic-coverage-moderator-expansion.md'
      - '.github/workflows/meta-analysis-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install raw-data reader
        run: python -m pip install --quiet openpyxl
      - name: Validate protocol-first meta-analysis state
        run: python scripts/check_meta_analysis_contract.py
      - name: Validate systematic coverage and moderator expansion
        run: python scripts/check_systematic_coverage_expansion_contract.py
      - name: Validate corpus and extraction progress
        run: python scripts/check_meta_analysis_progress.py
      - name: Audit Spondias site-level paternity effect
        run: python scripts/check_spondias_paternity_effect.py
      - name: Audit Spondias cohort multilayer cluster
        run: python scripts/check_spondias_multilayer_cluster.py
      - name: Probe Spondias supplementary files
        run: python scripts/probe_spondias_supplement.py
      - name: Inspect Spondias supplementary tables
        run: python scripts/inspect_spondias_supplement.py
      - name: Audit Brosimum site-level effects
        run: python scripts/check_brosimum_extraction.py
      - name: Probe Brosimum public raw-data package
        run: python scripts/probe_brosimum_figshare.py
      - name: Inspect Brosimum raw workbook hierarchy
        run: python scripts/audit_brosimum_raw_workbook.py
      - name: Recover Brosimum site-level multilayer effects
        run: python scripts/recover_brosimum_multilayer_cluster.py
      - name: Audit reconstructable Serapias gradient effects
        run: python scripts/check_serapias_extraction.py
      - name: Audit source-defined Serapias paired multilayer effects
        run: python scripts/check_serapias_binary_effects.py
      - name: Audit multilayer cluster dependence contract
        run: python scripts/check_multilayer_cluster_contract.py
      - name: Audit cross-system C-F pilot
        run: python scripts/check_cross_system_cf_pilot.py
      - name: Audit Magnolia native-scale model extraction
        run: python scripts/check_magnolia_extraction.py
      - name: Check manuscript claim sync
        run: python scripts/check_manuscript_claim_sync.py
      - name: Check study recovery and admission flow
        run: python scripts/check_study_flow_transparency.py
      - name: Check statistical estimand and Fisher interpretation
        run: python scripts/check_statistical_estimand_contract.py
      - name: Check covariance robustness and certification boundary
        run: python scripts/check_covariance_robustness.py
      - name: Audit all 17 primary marginal effects
        run: python scripts/check_primary_effect_supplement.py
      - name: Build supplementary primary-effect forest
        run: python scripts/build_primary_effect_forest.py
      - name: Check Journal of Ecology submission shape
        run: python scripts/check_journal_of_ecology_submission_shape.py
      - name: Check double-anonymous manuscript
        run: python scripts/check_double_anonymous_submission.py
      - name: Build Journal of Ecology figures and Table 1
        run: python scripts/build_journal_of_ecology_figures.py
      - name: Build anonymous reviewer code and data package
        run: python scripts/build_anonymous_review_package.py
      - name: Archive anonymous review package
        uses: actions/upload-artifact@v4
        with:
          name: anonymous-review-package
          path: build/anonymous_review_package.zip
          if-no-files-found: error
