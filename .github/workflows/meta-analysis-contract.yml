name: Multilayer meta-analysis contract

on:
  pull_request:
    paths:
      - 'README.md'
      - 'manuscript/MULTILAYER_FRAGMENTATION_META_ANALYSIS.md'
      - 'manuscript/META_ANALYSIS_PROTOCOL_2026-09-11.md'
      - 'manuscript/META_ANALYSIS_PROTOCOL_AMENDMENT_2026-09-11_EFFECT_UNITS.md'
      - 'manuscript/META_ANALYSIS_PROTOCOL_AMENDMENT_2026-09-11_GRADIENT_GEOMETRY.md'
      - 'manuscript/META_ANALYSIS_EXTRACTION_STATUS_2026-09-11.md'
      - 'manuscript/meta_analysis_effect_schema.json'
      - 'manuscript/meta_analysis_seed_sources.md'
      - 'manuscript/meta_analysis_candidate_ledger.csv'
      - 'manuscript/meta_analysis_primary_study_seed_v1.csv'
      - 'manuscript/meta_analysis_primary_study_seed_v1_sources.md'
      - 'manuscript/meta_analysis_extraction_queue_v1.csv'
      - 'manuscript/meta_analysis_submission_metadata.md'
      - 'evidence/meta_extraction/**'
      - 'scripts/check_meta_analysis_contract.py'
      - 'scripts/check_meta_analysis_progress.py'
      - 'scripts/check_brosimum_extraction.py'
      - 'scripts/check_serapias_extraction.py'
      - 'scripts/check_serapias_binary_effects.py'
      - 'scripts/check_magnolia_extraction.py'
      - '.github/workflows/meta-analysis-contract.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'manuscript/MULTILAYER_FRAGMENTATION_META_ANALYSIS.md'
      - 'manuscript/META_ANALYSIS_PROTOCOL_2026-09-11.md'
      - 'manuscript/META_ANALYSIS_PROTOCOL_AMENDMENT_2026-09-11_EFFECT_UNITS.md'
      - 'manuscript/META_ANALYSIS_PROTOCOL_AMENDMENT_2026-09-11_GRADIENT_GEOMETRY.md'
      - 'manuscript/META_ANALYSIS_EXTRACTION_STATUS_2026-09-11.md'
      - 'manuscript/meta_analysis_effect_schema.json'
      - 'manuscript/meta_analysis_seed_sources.md'
      - 'manuscript/meta_analysis_candidate_ledger.csv'
      - 'manuscript/meta_analysis_primary_study_seed_v1.csv'
      - 'manuscript/meta_analysis_primary_study_seed_v1_sources.md'
      - 'manuscript/meta_analysis_extraction_queue_v1.csv'
      - 'manuscript/meta_analysis_submission_metadata.md'
      - 'evidence/meta_extraction/**'
      - 'scripts/check_meta_analysis_contract.py'
      - 'scripts/check_meta_analysis_progress.py'
      - 'scripts/check_brosimum_extraction.py'
      - 'scripts/check_serapias_extraction.py'
      - 'scripts/check_serapias_binary_effects.py'
      - 'scripts/check_magnolia_extraction.py'
      - '.github/workflows/meta-analysis-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate protocol-first meta-analysis state
        run: python scripts/check_meta_analysis_contract.py
      - name: Validate corpus and extraction progress
        run: python scripts/check_meta_analysis_progress.py
      - name: Audit first admissible site-level effect
        run: python scripts/check_brosimum_extraction.py
      - name: Audit reconstructable Serapias gradient effects
        run: python scripts/check_serapias_extraction.py
      - name: Audit source-defined Serapias paired multilayer effects
        run: python scripts/check_serapias_binary_effects.py
      - name: Audit Magnolia native-scale model extraction
        run: python scripts/check_magnolia_extraction.py
