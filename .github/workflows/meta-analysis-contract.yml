      - 'scripts/check_magnolia_extraction.py'
      - 'scripts/check_manuscript_claim_sync.py'
      - 'scripts/check_study_flow_transparency.py'
      - 'scripts/check_statistical_estimand_contract.py'
      - 'scripts/check_covariance_robustness.py'
      - 'scripts/check_primary_effect_supplement.py'
