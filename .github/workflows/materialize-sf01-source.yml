name: Materialize SF01 source universe

on:
  workflow_dispatch:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/build_phase2_sf01_study_universe.py'
      - '.github/workflows/materialize-sf01-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download public KNB/DataONE Table S1 object
        run: |
          set -e
          PRIMARY='https://knb.ecoinformatics.org/knb/d1/mn/v2/object/bowdish.796.1'
          FALLBACK='https://knb.ecoinformatics.org/knb/metacat/bowdish.796.1/knb'
          if ! curl --fail --location --retry 3 --retry-delay 2 "$PRIMARY" -o /tmp/sf01_table.tsv; then
            curl --fail --location --retry 3 --retry-delay 2 "$FALLBACK" -o /tmp/sf01_table.tsv
          fi
          test -s /tmp/sf01_table.tsv
      - name: Build outcome-blind SF01 publication universe
        run: |
          python scripts/build_phase2_sf01_study_universe.py \
            /tmp/sf01_table.tsv evidence/meta_extraction
          test -s evidence/meta_extraction/phase2_sf01_publication_universe_v1.csv
          test -s evidence/meta_extraction/phase2_sf01_source_frame_summary_v1.json
          test -s manuscript/PHASE2_SF01_MATERIALIZATION_2026-09-20.md
      - name: Commit SF01 materialization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/meta_extraction/phase2_sf01_publication_universe_v1.csv \
            evidence/meta_extraction/phase2_sf01_source_frame_summary_v1.json \
            manuscript/PHASE2_SF01_MATERIALIZATION_2026-09-20.md
          if git diff --cached --quiet; then
            echo 'No SF01 materialization changes'
          else
            git commit -m 'Materialize SF01 publication universe'
            git push origin HEAD:meta/systematic-coverage-moderator-expansion-2026-09-16
          fi
