name: EGWEE GloPL within-species pollination polarity
on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/audit_glopl_within_species_pollen_polarity_20261028.py'
      - '.github/workflows/glopl-within-species-polarity.yml'
  pull_request:
    paths:
      - 'scripts/audit_glopl_within_species_pollen_polarity_20261028.py'
      - '.github/workflows/glopl-within-species-polarity.yml'
      - 'evidence/meta_extraction/glopl_2018/GloPL_with_id.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install --quiet numpy
      - name: Verify source original case hierarchy, duplication and mating-context classifications
        run: >
          python scripts/audit_glopl_within_species_pollen_polarity_20261028.py
          --output glopl_within_species_polarity_20261028.json
          --mixed_csv glopl_original_case_reversals_20261028.csv
      - uses: actions/upload-artifact@v4
        with:
          name: egwee-glopl-mating-context-polarity
          path: |
            glopl_within_species_polarity_20261028.json
            glopl_original_case_reversals_20261028.csv
