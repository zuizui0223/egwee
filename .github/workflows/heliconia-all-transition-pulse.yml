name: Heliconia complete adjacent-year pulse audit

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/audit_heliconia_all_transition_pulse.py'
      - 'scripts/audit_heliconia_forward_lag_prediction.py'
      - '.github/workflows/heliconia-all-transition-pulse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source pinned all consecutive-year transitions for common plots
        run: python scripts/audit_heliconia_all_transition_pulse.py --output build/heliconia_all_transition_pulse_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: heliconia-all-transition-pulse
          path: build/heliconia_all_transition_pulse_v1.json
          if-no-files-found: error
