name: State separation synthesis

on:
  pull_request:
    paths:
      - 'scripts/synthesize_state_separation.py'
      - 'scripts/check_state_separation_family_boundary.py'
      - 'manuscript/META_ANALYSIS_PROTOCOL_AMENDMENT_2026-09-13_STATE_SEPARATION_SYNTHESIS.md'
      - 'manuscript/STATE_SEPARATION_SYNTHESIS_RESULT_2026-09-13.md'
      - 'manuscript/META_ANALYSIS_CLUSTER_STATUS_2026-09-12.md'
      - 'evidence/meta_extraction/**'
      - '.github/workflows/state_separation_synthesis.yml'
  workflow_dispatch:

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run corrected primary synthesis and separate gradient diagnostic
        run: python scripts/synthesize_state_separation.py
      - name: Enforce primary-versus-gradient family boundary
        run: python scripts/check_state_separation_family_boundary.py
