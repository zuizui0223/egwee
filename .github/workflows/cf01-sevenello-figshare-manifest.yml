name: Probe CF01 Sevenello Figshare manifest

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/probe_cf01_sevenello_figshare.py'
      - '.github/workflows/cf01-sevenello-figshare-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public Figshare metadata only
        run: python scripts/probe_cf01_sevenello_figshare.py
      - name: Commit public manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/meta_extraction/phase2_cf01_sevenello_figshare_manifest_v1.json \
            manuscript/PHASE2_CF01_SEVENELLO_FIGSHARE_MANIFEST_2026-09-25.md
          if git diff --cached --quiet; then
            echo 'No Sevenello manifest changes'
          else
            git commit -m 'Probe Sevenello Figshare manifest'
            git pull --rebase origin meta/systematic-coverage-moderator-expansion-2026-09-16
            git push origin HEAD:meta/systematic-coverage-moderator-expansion-2026-09-16
          fi
