name: Webber 2023 held-patch insect and seed sentinel

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/audit_webber_2023_held_patch_sentinel.py'
      - '.github/workflows/webber-held-patch-sentinel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch CC0 original Zenodo data and verify published MD5 fingerprints
        run: python scripts/audit_webber_2023_held_patch_sentinel.py --output build/webber_2023_held_patch_sentinel.json
      - name: Archive identical patch/species predictive model scores
        uses: actions/upload-artifact@v4
        with:
          name: webber-held-patch-sentinel
          path: build/webber_2023_held_patch_sentinel.json
          if-no-files-found: error
