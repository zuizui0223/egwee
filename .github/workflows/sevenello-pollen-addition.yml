name: Sevenello source-locked pollen supplementation
on:
  pull_request:
    paths:
      - 'scripts/audit_sevenello_pollen_addition_20261019.py'
      - '.github/workflows/sevenello-pollen-addition.yml'
      - 'evidence/meta_extraction/sevenello_2026_raw/**'
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/audit_sevenello_pollen_addition_20261019.py'
      - '.github/workflows/sevenello-pollen-addition.yml'
      - 'evidence/meta_extraction/sevenello_2026_raw/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric libraries
        run: python -m pip install --quiet numpy scipy
      - name: Verify source checksums, units and all fixed treatment comparisons
        run: python scripts/audit_sevenello_pollen_addition_20261019.py --output sevenello_pollen_addition_20261019.json
      - uses: actions/upload-artifact@v4
        with:
          name: sevenello-pollen-addition-fully-audited
          path: sevenello_pollen_addition_20261019.json
