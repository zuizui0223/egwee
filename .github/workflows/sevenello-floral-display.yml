name: Sevenello floral-display decomposition
on:
  pull_request:
    paths:
      - 'scripts/audit_sevenello_floral_display_decomposition_20261019.py'
      - '.github/workflows/sevenello-floral-display.yml'
      - 'evidence/meta_extraction/sevenello_2026_raw/**'
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/audit_sevenello_floral_display_decomposition_20261019.py'
      - '.github/workflows/sevenello-floral-display.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific calculations
        run: python -m pip install --quiet numpy scipy
      - name: Verify data hashes and exact reproductive-yield decomposition
        run: python scripts/audit_sevenello_floral_display_decomposition_20261019.py --output sevenello_floral_display_20261019.json
      - uses: actions/upload-artifact@v4
        with:
          name: sevenello-floral-display-analysis
          path: sevenello_floral_display_20261019.json
