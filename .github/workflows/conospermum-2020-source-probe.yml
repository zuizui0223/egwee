name: Conospermum 2020 source probe

on:
  pull_request:
    paths:
      - 'manuscript/CONOSPERMUM_2020_CLUSTER_RECOVERY_CONTRACT.md'
      - 'scripts/probe_conospermum_2020_sources.py'
      - 'scripts/inspect_conospermum_2020_supplement.py'
      - 'scripts/probe_conospermum_thesis_download.py'
      - '.github/workflows/conospermum-2020-source-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed document reader
        run: python -m pip install --quiet python-docx
      - name: Probe locked source routes without effect extraction
        run: python scripts/probe_conospermum_2020_sources.py
      - name: Inspect locked supplementary document
        run: python scripts/inspect_conospermum_2020_supplement.py
      - name: Resolve thesis download candidates
        run: python scripts/probe_conospermum_thesis_download.py
