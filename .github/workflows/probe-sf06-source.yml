name: Probe SF06 OUP source

on:
  workflow_dispatch:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - '.github/workflows/probe-sf06-source.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public SF06 supplementary Table S1
        env:
          SF06_URL: "https://oup.silverchair-cdn.com/oup/backfile/Content_public/Journal/aob/135/1-2/10.1093_aob_mcae076/3/mcae076_suppl_supplementary_table_s1.docx?Expires=2147483647&Key-Pair-Id=APKAIE5G5CRDK6RD3PGA&Signature=rle~osXl4raEfRMlNTM5s1~kCtSQwInJCzqnYA0y~mDQpFSv35J1z8f22RgYswXL-TfqgP1hqwVPZMVRMZv00bdVmYaEOgs7wbNHRN~FXXssVHSrQNbs7Lffp5YM3uqC-IPM24Yustxqj--BikcriS~Emzlvb~4kLJU9EdI564kD7U-KIZExe3lrgyRP761ed3OWLJv-5Qvdx3X7~oI3RK7l5Dzu1PJI2hZ6MdupGwuPqh~OHhe32BNCyWzVUbt1Ym~Qx1rFKmM0IX4XTxLtYrEAbbabVALTSXXwGLRugUivL5NtVBhr4kwLL6HrfY9IDOnpX1~g69ymeWGP7E3O7A__"
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "$SF06_URL" -o /tmp/sf06_table_s1.docx
          test -s /tmp/sf06_table_s1.docx
          file /tmp/sf06_table_s1.docx
      - name: Inspect DOCX table schemas only
        run: |
          python - <<'PY'
          import zipfile
          from xml.etree import ElementTree as ET

          path='/tmp/sf06_table_s1.docx'
          NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main'
          q=lambda tag: f'{{{NS}}}{tag}'

          with zipfile.ZipFile(path) as zf:
              root=ET.fromstring(zf.read('word/document.xml'))

          tables=root.findall('.//'+q('tbl'))
          print('SF06_TABLE_COUNT', len(tables))
          for idx,table in enumerate(tables,1):
              rows=table.findall('./'+q('tr'))
              header=[]
              if rows:
                  cells=rows[0].findall('./'+q('tc'))
                  for cell in cells:
                      text=' '.join(
                          (t.text or '').strip()
                          for t in cell.iter(q('t'))
                          if (t.text or '').strip()
                      )
                      header.append(' '.join(text.split()))
              max_cols=max((len(r.findall('./'+q('tc'))) for r in rows), default=0)
              print('SF06_TABLE', 'index='+str(idx), 'rows='+str(len(rows)), 'max_cols='+str(max_cols), 'header='+repr(header))
          PY
          python - <<'PY'
          import zipfile
          from xml.etree import ElementTree as ET

          NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main'
          q=lambda tag: f'{{{NS}}}{tag}'
          with zipfile.ZipFile('/tmp/sf06_table_s1.docx') as zf:
              root=ET.fromstring(zf.read('word/document.xml'))
          tables=root.findall('.//'+q('tbl'))

          def cell_info(cell):
              text=' '.join(
                  (t.text or '').strip()
                  for t in cell.iter(q('t'))
                  if (t.text or '').strip()
              )
              tcpr=cell.find('./'+q('tcPr'))
              span=1
              if tcpr is not None:
                  gs=tcpr.find('./'+q('gridSpan'))
                  if gs is not None:
                      span=int(gs.attrib.get(q('val'),'1'))
              return ' '.join(text.split()), span

          for ti in (0,1,5,6):
              table=tables[ti]
              rows=table.findall('./'+q('tr'))
              for ri in range(min(2,len(rows))):
                  vals=[cell_info(c) for c in rows[ri].findall('./'+q('tc'))]
                  print('SF06_STRUCT', 'table='+str(ti+1), 'row='+str(ri+1), repr(vals))
          PY
