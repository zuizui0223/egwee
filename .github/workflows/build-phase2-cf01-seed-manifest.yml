name: Build Phase-2 CF01 seed manifest

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/build_phase2_cf01_seed_manifest.py'
      - '.github/workflows/build-phase2-cf01-seed-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build canonical CF01 seed manifest
        run: python scripts/build_phase2_cf01_seed_manifest.py
      - name: Commit CF01 seed manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/meta_extraction/phase2_cf01_seed_manifest_v1.csv \
            evidence/meta_extraction/phase2_cf01_seed_manifest_summary_v1.json \
            manuscript/PHASE2_CF01_SEED_MANIFEST_2026-09-21.md
          if git diff --cached --quiet; then
            echo 'No CF01 seed-manifest changes'
          else
            git commit -m 'Build Phase-2 CF01 seed manifest'
            git push origin HEAD:meta/systematic-coverage-moderator-expansion-2026-09-16
          fi
