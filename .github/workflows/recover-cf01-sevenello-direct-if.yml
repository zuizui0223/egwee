name: Recover CF01 Sevenello direct I-F

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'manuscript/CF01_SEVENELLO_2026_DIRECT_IF_RECOVERY_CONTRACT.md'
      - 'scripts/recover_phase2_cf01_sevenello_direct_if.py'
      - '.github/workflows/recover-cf01-sevenello-direct-if.yml'
      - 'evidence/meta_extraction/phase2_cf01_sevenello_figshare_manifest_v1.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover frozen raw-data Edge-Core I-F panels
        run: python scripts/recover_phase2_cf01_sevenello_direct_if.py
      - name: Commit derived recovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/meta_extraction/phase2_cf01_sevenello_transect_values_v1.csv \
            evidence/meta_extraction/phase2_cf01_sevenello_direct_effects_v1.csv \
            evidence/meta_extraction/phase2_cf01_sevenello_direct_covariance_v1.json \
            manuscript/PHASE2_CF01_SEVENELLO_DIRECT_IF_RECOVERY_2026-09-25.md
          if git diff --cached --quiet; then
            echo 'No Sevenello direct-I-F changes'
          else
            git commit -m 'Recover Sevenello direct I-F programme'
            git pull --rebase origin meta/systematic-coverage-moderator-expansion-2026-09-16
            git push origin HEAD:meta/systematic-coverage-moderator-expansion-2026-09-16
          fi
