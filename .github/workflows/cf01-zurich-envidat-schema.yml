name: Inspect CF01 Zurich EnviDat schema

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/inspect_cf01_zurich_envidat_schema.py'
      - '.github/workflows/cf01-zurich-envidat-schema.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install --quiet openpyxl
      - name: Download public EnviDat archive
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.envidat.ch/dataset/d8e61f31-c2e5-4052-8784-b1624dfbfc40/resource/cef4a88c-0ef6-4327-a4a0-fc7d33b468e5/download/rejichacko_etal_2025_envidat.zip' \
            -o /tmp/zurich_envidat.zip
          test -s /tmp/zurich_envidat.zip
          unzip -t /tmp/zurich_envidat.zip
      - name: Inspect schema only
        run: python scripts/inspect_cf01_zurich_envidat_schema.py /tmp/zurich_envidat.zip
      - name: Commit schema gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/meta_extraction/phase2_cf01_zurich_envidat_schema_v1.json \
            manuscript/PHASE2_CF01_ZURICH_ENVIDAT_SCHEMA_2026-09-24.md
          if git diff --cached --quiet; then
            echo 'No Zurich schema changes'
          else
            git commit -m 'Inspect CF01 Zurich EnviDat schema'
            git pull --rebase origin meta/systematic-coverage-moderator-expansion-2026-09-16
            git push origin HEAD:meta/systematic-coverage-moderator-expansion-2026-09-16
          fi
