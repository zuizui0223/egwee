name: Expand Phase-2 CF01 citations

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/resolve_phase2_cf01_openalex.py'
      - 'scripts/expand_phase2_cf01_openalex.py'
      - '.github/workflows/expand-phase2-cf01-openalex.yml'
      - 'evidence/meta_extraction/phase2_cf01_seed_manifest_v1.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve all CF01 seed bibliographies through OpenAlex
        run: python scripts/resolve_phase2_cf01_openalex.py
      - name: Expand all resolved seeds through OpenAlex citations
        run: python scripts/expand_phase2_cf01_openalex.py
      - name: Commit citation expansion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/meta_extraction/phase2_cf01_bibliographic_resolution_v1.csv \
            evidence/meta_extraction/phase2_cf01_bibliographic_resolution_summary_v1.json \
            manuscript/PHASE2_CF01_BIBLIOGRAPHIC_RESOLUTION_2026-09-21.md \
            evidence/meta_extraction/phase2_cf01_citation_edges_v1.csv \
            evidence/meta_extraction/phase2_cf01_citation_candidate_universe_v1.csv \
            evidence/meta_extraction/phase2_cf01_citation_expansion_summary_v1.json \
            manuscript/PHASE2_CF01_CITATION_EXPANSION_2026-09-21.md
          if git diff --cached --quiet; then
            echo 'No CF01 citation-expansion changes'
          else
            git commit -m 'Resolve and expand Phase-2 CF01 citation graph'
            git pull --rebase origin meta/systematic-coverage-moderator-expansion-2026-09-16
            git push origin HEAD:meta/systematic-coverage-moderator-expansion-2026-09-16
          fi
