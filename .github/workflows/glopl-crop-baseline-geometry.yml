name: GloPL PolLimCrop source-conditional ecology
on:
  pull_request:
    paths:
      - 'scripts/audit_glopl_crop_baseline_geometry_20261024.py'
      - '.github/workflows/glopl-crop-baseline-geometry.yml'
      - 'evidence/meta_extraction/glopl_2018/**'
      - 'evidence/meta_extraction/pollimcrop_2023/**'
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'scripts/audit_glopl_crop_baseline_geometry_20261024.py'
      - '.github/workflows/glopl-crop-baseline-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Check source-pinned baseline and within-paper permutation diagnostics
        run: python scripts/audit_glopl_crop_baseline_geometry_20261024.py --output glopl_crop_baseline_geometry_20261024.json
      - uses: actions/upload-artifact@v4
        with:
          name: egwee-baseline-source-conditional-geometry
          path: glopl_crop_baseline_geometry_20261024.json
