name: Build Phase-2 CF01 candidate queue

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'evidence/meta_extraction/phase2_cf01_citation_candidate_universe_v1.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build outcome-blind candidate identity queue
        run: python scripts/build_phase2_cf01_candidate_queue.py
      - name: Commit candidate queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/meta_extraction/phase2_cf01_candidate_screen_queue_v1.csv \
            evidence/meta_extraction/phase2_cf01_candidate_dedup_summary_v1.json \
            manuscript/PHASE2_CF01_CANDIDATE_QUEUE_2026-09-23.md
          if git diff --cached --quiet; then
            echo 'No CF01 candidate-queue changes'
          else
            git commit -m 'Build Phase-2 CF01 candidate identity queue'
            git pull --rebase origin meta/systematic-coverage-moderator-expansion-2026-09-16
            git push origin HEAD:meta/systematic-coverage-moderator-expansion-2026-09-16
          fi
