name: Build Phase-2 CF01 candidate queue

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'evidence/meta_extraction/phase2_cf01_citation_candidate_universe_v1.csv'
      - '.github/workflows/build-phase2-cf01-candidate-queue.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit resolved CF01 seed work identities
        run: python scripts/build_phase2_cf01_seed_work_identity.py
      - name: Build outcome-blind candidate identity queue
        run: python scripts/build_phase2_cf01_candidate_queue.py
      - name: Build outcome-blind abstract triage
        run: python scripts/triage_phase2_cf01_candidate_abstracts.py
      - name: Commit candidate queue and triage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/meta_extraction/phase2_cf01_seed_work_identity_v1.csv \
            evidence/meta_extraction/phase2_cf01_seed_duplicate_work_groups_v1.csv \
            evidence/meta_extraction/phase2_cf01_seed_work_identity_summary_v1.json \
            manuscript/PHASE2_CF01_SEED_WORK_IDENTITY_2026-09-23.md \
            evidence/meta_extraction/phase2_cf01_candidate_screen_queue_v1.csv \
            evidence/meta_extraction/phase2_cf01_candidate_dedup_summary_v1.json \
            manuscript/PHASE2_CF01_CANDIDATE_QUEUE_2026-09-23.md \
            evidence/meta_extraction/phase2_cf01_candidate_abstract_triage_v1.csv \
            evidence/meta_extraction/phase2_cf01_candidate_abstract_triage_summary_v1.json \
            manuscript/PHASE2_CF01_ABSTRACT_TRIAGE_2026-09-23.md
          if git diff --cached --quiet; then
            echo 'No CF01 candidate-queue changes'
          else
            git commit -m 'Build CF01 seed identity candidate and abstract queues'
            git pull --rebase origin meta/systematic-coverage-moderator-expansion-2026-09-16
            git push origin HEAD:meta/systematic-coverage-moderator-expansion-2026-09-16
          fi
