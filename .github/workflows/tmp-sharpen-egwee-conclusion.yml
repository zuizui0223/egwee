name: Sharpen EGWEE conclusion

on:
  push:
    branches: [agent/sharpen-egwee-conclusion]
    paths:
      - 'scripts/tmp_sharpen_egwee_conclusion.py'
      - '.github/workflows/tmp-sharpen-egwee-conclusion.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sharpen-egwee-conclusion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply conclusion update
        run: python scripts/tmp_sharpen_egwee_conclusion.py
      - name: Validate conclusion and submission builder
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path('manuscript/natural_data_ecological_indicators_spine.md').read_text(encoding='utf-8')
          assert '## 5. Conclusion' in t
          assert 'Test the state before interpreting the residual.' in t
          assert 'residual cannot diagnose state incompleteness' in t
          assert '## 6. Claim ceiling' in t
          PY
          python scripts/build_ecological_indicators_submission.py --help >/dev/null
      - name: Commit conclusion update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/natural_data_ecological_indicators_spine.md
          git diff --cached --quiet && exit 0
          git commit -m "Sharpen EGWEE paper conclusion"
          git push origin HEAD:agent/sharpen-egwee-conclusion
