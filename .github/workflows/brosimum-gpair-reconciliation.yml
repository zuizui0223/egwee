name: Brosimum G-pair reconciliation

on:
  push:
    branches:
      - meta/systematic-coverage-moderator-expansion-2026-09-16
    paths:
      - 'manuscript/BROSIMUM_GPAIR_RECONCILIATION_RULE_2026-09-19.md'
      - 'manuscript/PHASE2_ML002_BROSIMUM_GPAIR_RECONCILIATION_2026-09-19.md'
      - 'scripts/check_brosimum_genetic_he_fallback.py'
      - '.github/workflows/brosimum-gpair-reconciliation.yml'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install --quiet openpyxl
      - name: Verify fail-closed genetic reconciliation state
        run: python scripts/check_brosimum_genetic_he_fallback.py
